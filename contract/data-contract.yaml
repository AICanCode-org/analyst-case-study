# FunnelLens data contract: what every track must produce from a raw export, and what must be true
# of the clean tables before any number is reported. Shared by the Python, SQL and R tracks.
# The cleaning rules and every formula are in contract/questions.md; the output shape in
# contract/answers.schema.json. Change this file with a pull request and bump `version` (SemVer).
contract: funnellens
version: "1.1.0"   # 1.1.0: channel referral, exclude_weeks, monitoring (see CHANGELOG)

raw:  # columns each raw CSV must have (extra columns are allowed and ignored: additive changes are compatible)
  users: [user_id, signup_date, signup_channel, city]
  sessions: [session_id, user_id, device, channel, started_at]
  events: [session_id, event_name, event_at]
  orders: [order_id, session_id, amount]

cleaning:
  devices: [desktop, mobile]
  channels: [email, organic, paid_social, referral, unknown]   # referral: new programme from July 2026
  unknown_channel_values: ["", "(not set)", "unknown"]
  steps: [view, cart, checkout]
  city_aliases: {bangalore: bengaluru, bombay: mumbai}
  # ISO weeks whose tracking is known to be broken; their sessions (and so their events and orders) are
  # dropped before any metric. 2026-W31: app release 8.14 lost ~70 % of mobile checkout events
  # (incident FL-2026-08, docs/postmortem-2026-W31.md). Remove a week only with a post-mortem.
  exclude_weeks: ["2026-W31"]

# Checks run on the clean tables (and on issue counts), in this order. A failing `error` check stops
# the pipeline (exit code 3) before any answer is written; a failing `warn` check is reported.
checks:
  - {id: sessions.row_count, type: row_count_min, table: sessions, min: 1000, severity: error}
  - {id: users.user_id.unique, type: unique, table: users, column: user_id, severity: error}
  - {id: sessions.session_id.unique, type: unique, table: sessions, column: session_id, severity: error}
  - {id: sessions.device.accepted, type: accepted_values, table: sessions, column: device, values_from: devices, severity: error}
  - {id: sessions.channel.accepted, type: accepted_values, table: sessions, column: channel, values_from: channels, severity: error}
  - {id: sessions.started_at.in_period, type: in_period, table: sessions, column: started_at, severity: error}
  - {id: events.event_name.accepted, type: accepted_values, table: events, column: event_name, values_from: steps, severity: error}
  - {id: events.session_id.relationship, type: relationship, table: events, column: session_id, to: sessions.session_id, severity: error}
  - {id: orders.order_id.unique, type: unique, table: orders, column: order_id, severity: error}
  - {id: orders.amount_paise.range, type: range, table: orders, column: amount_paise, min: 100, max: 10000000, severity: error}
  - {id: orders.session_id.relationship, type: relationship, table: orders, column: session_id, to: sessions.session_id, severity: error}
  - {id: sessions.duplicate_rows.ratio, type: max_ratio, issue: sessions_exact_duplicates, of: raw.sessions, max: 0.02, severity: warn}
  - {id: sessions.unknown_channel.ratio, type: max_ratio, issue: sessions_unknown_channel, of: clean.sessions, max: 0.10, severity: warn}
  - {id: users.missing_signup_channel.ratio, type: max_ratio, issue: users_missing_signup_channel, of: raw.users, max: 0.10, severity: warn}
  - {id: orders.unparseable_amount.ratio, type: max_ratio, issue: orders_unparseable_amount, of: raw.orders, max: 0.005, severity: warn}
  - {id: orders.without_checkout.ratio, type: max_ratio, issue: orders_without_checkout, of: clean.orders, max: 0.02, severity: warn}

# Data-quality monitoring (questions.md §6), reported in answers.monitoring; it never stops the run.
monitoring:
  max_relative_deviation: 0.30   # a full ISO week whose value is more than 30 % away from the median is flagged
  max_days_behind: 2             # the last clean session must be at most 2 days before period_end

analysis:
  alpha: 0.05
  z_975: 1.959963984540054          # standard normal 97.5 % quantile, the same constant in every track
  rebuild_min_monthly_uplift_inr: 2500000   # a rebuild (~₹75 lakh of engineering) must pay back within 3 months
