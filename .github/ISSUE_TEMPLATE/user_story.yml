name: Analysis question (user story)
description: A question a stakeholder needs answered, with how we will know the answer is right
labels: [story]
body:
  - type: textarea
    id: story
    attributes:
      label: Story
      value: "As a <Head of Product | finance | CRM lead>, I want to know <question> so that I can <decision>."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: The metric, its definition (questions.md section), the test that pins it and the caveat it needs.
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Estimate
      options: [S (< 2 h), M (half a day), L (a day or more: split it)]
