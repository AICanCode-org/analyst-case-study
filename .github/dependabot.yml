# Dependabot opens PRs for dependency updates. Minor/patch updates are grouped per ecosystem so
# you get one PR a week instead of twenty. Phase 7 asks you to review one of them: a dependency
# update in an analysis is only safe if the golden answers still match.
version: 2
updates:
  - package-ecosystem: pip
    directories: [/tracks/python, /tracks/sql, /dashboard]
    schedule: { interval: weekly }
    groups:
      python-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
