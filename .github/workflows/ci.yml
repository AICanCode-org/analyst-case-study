# Full CI (Phase 6: Phase 5 + a Docker job that builds every image, runs the three pipelines in
# containers with the parity check, and smoke-tests the dashboard, also with the AI provider down). Runs only the tracks whose files changed (plus everything when shared files
# change), each through the reusable workflow, then checks that every track's answers.json is
# identical to the golden answers. "ci-ok" is the single check to mark as *required* in branch
# protection.  Every concept is explained in docs/github-actions-explained.md.
name: CI

on:
  push:
    branches: [main, solution]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      docs: ${{ steps.filter.outputs.docs }}
      python: ${{ steps.filter.outputs.python }}
      sql: ${{ steps.filter.outputs.sql }}
      r: ${{ steps.filter.outputs.r }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'cms/**'
            shared:
              - 'contract/**'
              - 'data/**'
              - 'scripts/**'
              - 'docker-compose.yml'
              - '.github/workflows/**'
            python:
              - 'tracks/python/**'
            sql:
              - 'tracks/sql/**'
            r:
              - 'tracks/r/**'
            dashboard:
              - 'dashboard/**'

  contract:
    name: Contract · data + scripts + CMS export
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The committed exports are exactly what the seeded generator produces
        run: python3 scripts/generate_data.py --check
      - name: Every golden answers file matches answers.schema.json
        run: |
          pip install -q jsonschema==4.23.0
          python3 - <<'PY'
          import json, pathlib, jsonschema
          schema = json.loads(pathlib.Path("contract/answers.schema.json").read_text())
          for path in sorted(pathlib.Path("contract/golden").glob("answers-*.json")):
              jsonschema.validate(json.loads(path.read_text()), schema)
              print("valid:", path)
          PY
      - name: Python scripts compile (standard library only)
        run: python3 -m py_compile scripts/*.py
      - name: Check shell scripts
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck --severity=error scripts/*.sh
      - name: CMS export is up to date with docs/ (python3 scripts/build-cms.py)
        run: python3 scripts/build-cms.py --check

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-track-ci.yml
    with:
      track: python

  sql:
    needs: changes
    if: needs.changes.outputs.sql == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-track-ci.yml
    with:
      track: sql

  r:
    needs: changes
    if: needs.changes.outputs.r == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-track-ci.yml
    with:
      track: r

  parity:
    name: Parity · every track's answers.json = the golden answers (1e-9)
    needs: [python, sql, r]
    if: always() && (needs.python.result == 'success' || needs.sql.result == 'success' || needs.r.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: answers-*
          path: answers
      - name: Compare with the golden file of the same export
        run: |
          files=(answers/*/answers.json)
          export=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["dataset"]["export"])' "${files[0]}")
          python3 scripts/parity.py "contract/golden/answers-$export.json" "${files[@]}" | tee parity.txt
          { echo '### Parity'; echo '```'; cat parity.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  dashboard:
    name: Dashboard · lint + tests (AI narrator against a fake LLM)
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements-dev.txt
      - run: make install
      - run: make lint
      - run: make coverage

  docker:
    name: Docker · images, pipelines + parity in containers, dashboard smoke test
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.python == 'true' || needs.changes.outputs.sql == 'true' || needs.changes.outputs.r == 'true' || needs.changes.outputs.dashboard == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build every image (dashboard + the three pipelines)
        run: docker compose --profile pipelines build
      - name: Run each track's pipeline in its container (non-root, read-only file system)
        run: |
          for track in python sql r; do docker compose --profile pipelines run --rm "$track"; done
      - name: Parity of the three containers' answers.json
        run: docker compose --profile pipelines run --rm --no-deps parity
      - name: Start the dashboard and wait until its health check passes
        run: docker compose up -d --no-build --wait --wait-timeout 120 dashboard
      - name: Smoke test
        run: scripts/smoke-test.sh http://localhost:8501
      - name: The AI provider is down → the narrator falls back to the template, the dashboard still works
        env:
          AI_PROVIDER: llm
          LLM_BASE_URL: http://10.255.255.1:9/v1
          LLM_TIMEOUT_MS: "1500"
        run: |
          docker compose up -d --no-build --wait --wait-timeout 120 --force-recreate dashboard
          EXPECT_FALLBACK=true scripts/smoke-test.sh http://localhost:8501
      - name: Show logs on failure
        if: failure()
        run: docker compose --profile pipelines logs --no-color
      - name: Tear down
        if: always()
        run: docker compose --profile pipelines down -v

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, contract, python, sql, r, parity, dashboard, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled (skipped is fine)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
