# Starter CI: lint + unit tests for every track on every push and pull request.
# Pending tests are skipped, so this is green on day one. In Phase 5 you replace this file with the
# full pipeline (path filters, data tests + coverage gate, notebook / R Markdown execution, parity
# across tracks, the dashboard). Every concept used here is explained in docs/github-actions-explained.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.track }} · lint + unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        track: [python, sql, r]
    defaults:
      run:
        working-directory: tracks/${{ matrix.track }}
    steps:
      - uses: actions/checkout@v4

      - if: matrix.track != 'r'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tracks/${{ matrix.track }}/requirements-dev.txt

      - if: matrix.track == 'r'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true
      - if: matrix.track == 'r'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: tracks/r
          extra-packages: any::lintr, any::testthat, any::pkgload

      - name: Install dependencies
        if: matrix.track != 'r'
        run: make install
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
