# Reusable workflow: the full check for ONE track. Called by ci.yml once per track.
# Every track exposes the same Makefile targets (install, lint, test, coverage, run, report), so the
# steps are identical; only the toolchain setup differs.  Explained in docs/github-actions-explained.md §7.
name: Reusable · track CI

on:
  workflow_call:
    inputs:
      track:
        description: "python | sql | r"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: lint · unit · data · coverage · report
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tracks/${{ inputs.track }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12 (+ pip cache)
        if: inputs.track != 'r'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tracks/${{ inputs.track }}/requirements-dev.txt

      - name: Set up R 4.5 (binary packages from Posit Public Package Manager)
        if: inputs.track == 'r'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true
      - name: Install the R packages of DESCRIPTION (+ cache)
        if: inputs.track == 'r'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: tracks/r
          extra-packages: any::lintr, any::testthat, any::pkgload, any::covr, any::rmarkdown
      - name: Set up pandoc (R Markdown needs it to knit HTML)
        if: inputs.track == 'r'
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install dependencies
        if: inputs.track != 'r'
        run: make install
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Unit + data tests with coverage gate (≥ 85 % lines)
        run: make coverage
      - name: answers.json for the committed export
        run: make run OUT=out
      - name: Report, executed top to bottom from a clean checkout
        run: make report OUT=out

      - name: Upload answers.json (the parity job compares the tracks)
        uses: actions/upload-artifact@v4
        with:
          name: answers-${{ inputs.track }}
          path: tracks/${{ inputs.track }}/out/answers.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload the report and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ inputs.track }}
          path: |
            tracks/${{ inputs.track }}/out/
            tracks/${{ inputs.track }}/coverage.xml
          if-no-files-found: ignore
          retention-days: 7
