[project]
name = "funnellens-dashboard"
version = "1.1.0"
description = "FunnelLens analysis, dashboard and AI narrator"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]   # the rupee sign and typographic characters are intended

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["funnellens_dashboard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
